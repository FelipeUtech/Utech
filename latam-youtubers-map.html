<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de YouTubers en Latinoamérica</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; }
        #map { width: 100%; height: 100vh; }

        .info-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: rgba(255,255,255,0.97);
            padding: 16px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            max-width: 300px;
            max-height: 85vh;
            overflow-y: auto;
        }
        .info-panel h2 {
            font-size: 16px;
            margin-bottom: 10px;
            color: #c0392b;
            border-bottom: 2px solid #c0392b;
            padding-bottom: 6px;
        }
        .country-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 4px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 13px;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.15s;
        }
        .country-row:hover { background: #fef0ef; }
        .country-name { font-weight: 500; color: #333; }
        .country-count {
            background: #c0392b;
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 11px;
            min-width: 36px;
            text-align: center;
        }

        .legend {
            position: absolute;
            bottom: 30px;
            left: 10px;
            z-index: 1000;
            background: rgba(255,255,255,0.95);
            padding: 12px 14px;
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.25);
        }
        .legend h4 { margin-bottom: 8px; font-size: 13px; color: #333; }
        .legend-item { display: flex; align-items: center; margin-bottom: 3px; font-size: 11px; color: #555; }
        .legend-color { width: 22px; height: 12px; margin-right: 8px; border-radius: 2px; border: 1px solid rgba(0,0,0,0.15); }

        .edit-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.55);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .edit-modal.active { display: flex; }
        .edit-content {
            background: white;
            padding: 28px;
            border-radius: 14px;
            min-width: 320px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.35);
        }
        .edit-content h3 { margin-bottom: 16px; color: #222; font-size: 20px; }
        .edit-content label { display: block; margin-bottom: 6px; font-weight: 500; color: #555; font-size: 14px; }
        .edit-content input {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 18px;
            margin-bottom: 18px;
            transition: border-color 0.2s;
        }
        .edit-content input:focus { border-color: #c0392b; outline: none; }
        .btn-group { display: flex; gap: 10px; }
        .btn {
            flex: 1;
            padding: 11px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn-save { background: #c0392b; color: white; }
        .btn-save:hover { background: #a93226; }
        .btn-cancel { background: #ecf0f1; color: #333; }
        .btn-cancel:hover { background: #d5dbdb; }

        .title-bar {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(255,255,255,0.97);
            padding: 10px 28px;
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.25);
            text-align: center;
            white-space: nowrap;
        }
        .title-bar h1 { font-size: 18px; color: #222; }
        .title-bar p { font-size: 11px; color: #888; margin-top: 2px; }

        .country-label {
            background: none !important;
            border: none !important;
            box-shadow: none !important;
            font-weight: bold;
            font-size: 12px;
            color: #111;
            text-shadow: 0 0 4px white, 0 0 4px white, 0 0 4px white;
        }

        .loading-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #1a1a2e;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 18px;
            font-family: 'Segoe UI', sans-serif;
        }
        .loading-overlay .spinner {
            width: 40px; height: 40px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top-color: #c0392b;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 14px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        Cargando mapa...
    </div>

    <div id="map"></div>

    <div class="title-bar">
        <h1>YouTubers en Latinoamérica</h1>
        <p>Clic en un país para editar</p>
    </div>

    <div class="info-panel" id="infoPanel">
        <h2>Ranking por País</h2>
        <div id="rankingList"></div>
        <div style="margin-top: 10px; font-size: 12px; color: #999; text-align: center;">
            Total: <strong id="totalCount">0</strong> YouTubers
        </div>
    </div>

    <div class="legend" id="legend"></div>

    <div class="edit-modal" id="editModal">
        <div class="edit-content">
            <h3 id="editTitle">Editar país</h3>
            <label for="editInput">Número de YouTubers:</label>
            <input type="number" id="editInput" min="0" step="1" />
            <div class="btn-group">
                <button class="btn btn-cancel" onclick="closeModal()">Cancelar</button>
                <button class="btn btn-save" onclick="saveEdit()">Guardar</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/topojson-client@3"></script>
    <script>
        // ====================================================================
        // DATOS DE YOUTUBERS POR PAÍS — MODIFICA AQUÍ LOS VALORES
        // ====================================================================
        const youtuberData = {
            "Mexico":                 820,
            "Brazil":                 1450,
            "Argentina":              410,
            "Colombia":               380,
            "Chile":                  290,
            "Peru":                   260,
            "Venezuela":              200,
            "Ecuador":                120,
            "Guatemala":              85,
            "Cuba":                   40,
            "Dominican Rep.":         75,
            "Honduras":               55,
            "Paraguay":               45,
            "El Salvador":            50,
            "Nicaragua":              35,
            "Costa Rica":             90,
            "Panama":                 70,
            "Uruguay":                65,
            "Bolivia":                80,
            "Puerto Rico":            60,
            "Haiti":                  15,
            "Jamaica":                30,
            "Trinidad and Tobago":    20,
            "Guyana":                 8,
            "Suriname":               5,
            "Belize":                 10,
            "Fr. S. Antarctic Lands": 0,
        };

        // Nombres en español para mostrar
        const displayNames = {
            "Mexico": "México",
            "Brazil": "Brasil",
            "Argentina": "Argentina",
            "Colombia": "Colombia",
            "Chile": "Chile",
            "Peru": "Perú",
            "Venezuela": "Venezuela",
            "Ecuador": "Ecuador",
            "Guatemala": "Guatemala",
            "Cuba": "Cuba",
            "Dominican Rep.": "Rep. Dominicana",
            "Honduras": "Honduras",
            "Paraguay": "Paraguay",
            "El Salvador": "El Salvador",
            "Nicaragua": "Nicaragua",
            "Costa Rica": "Costa Rica",
            "Panama": "Panamá",
            "Uruguay": "Uruguay",
            "Bolivia": "Bolivia",
            "Puerto Rico": "Puerto Rico",
            "Haiti": "Haití",
            "Jamaica": "Jamaica",
            "Trinidad and Tobago": "Trinidad y Tobago",
            "Guyana": "Guyana",
            "Suriname": "Surinam",
            "Belize": "Belice",
        };

        // Coordenadas centro para labels
        const countryCoords = {
            "Mexico": [23.6, -102.5],
            "Brazil": [-14.2, -51.9],
            "Argentina": [-38.4, -63.6],
            "Colombia": [4.5, -74.3],
            "Chile": [-35.7, -71.5],
            "Peru": [-9.2, -75.0],
            "Venezuela": [6.4, -66.6],
            "Ecuador": [-1.8, -78.2],
            "Guatemala": [15.8, -90.2],
            "Cuba": [21.5, -79.0],
            "Dominican Rep.": [18.7, -70.2],
            "Honduras": [15.2, -86.2],
            "Paraguay": [-23.4, -58.4],
            "El Salvador": [13.8, -88.9],
            "Nicaragua": [12.9, -85.2],
            "Costa Rica": [9.7, -83.8],
            "Panama": [8.5, -80.8],
            "Uruguay": [-32.5, -55.8],
            "Bolivia": [-16.3, -63.6],
            "Puerto Rico": [18.2, -66.6],
            "Haiti": [19.0, -72.3],
            "Jamaica": [18.1, -77.3],
            "Trinidad and Tobago": [10.4, -61.2],
            "Guyana": [4.9, -58.9],
            "Suriname": [3.9, -56.0],
            "Belize": [17.2, -88.5],
        };

        // Países LATAM por nombre (como aparecen en world-atlas 110m)
        const latamNames = new Set(Object.keys(youtuberData));

        function getColor(count) {
            if (count >= 1000) return '#67000d';
            if (count >= 500)  return '#a50f15';
            if (count >= 300)  return '#cb181d';
            if (count >= 200)  return '#ef3b2c';
            if (count >= 100)  return '#fb6a4a';
            if (count >= 50)   return '#fc9272';
            if (count >= 20)   return '#fcbba1';
            if (count >= 1)    return '#fee0d2';
            return '#f0f0f0';
        }

        // Init map
        const map = L.map('map', {
            center: [4, -68],
            zoom: 4,
            minZoom: 3,
            maxZoom: 8,
            zoomControl: true
        });

        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO'
        }).addTo(map);

        let geojsonLayer;
        let currentEditCountry = null;
        let countryLayers = {};
        let labelMarkers = [];

        // Usar world-atlas TopoJSON (110m = ~300KB, mucho más ligero)
        fetch('https://unpkg.com/world-atlas@2/countries-110m.json')
            .then(r => r.json())
            .then(topology => {
                const geojson = topojson.feature(topology, topology.objects.countries);

                // Necesitamos mapear IDs numéricos a nombres
                // Cargar nombres desde el mismo paquete
                return fetch('https://unpkg.com/world-atlas@2/countries-110m.json')
                    .then(() => {
                        // Los IDs en world-atlas son numéricos (ISO 3166-1 numeric)
                        // Mapeamos los que necesitamos
                        const idToName = {
                            32: "Argentina", 68: "Bolivia", 76: "Brazil", 152: "Chile",
                            170: "Colombia", 188: "Costa Rica", 192: "Cuba", 214: "Dominican Rep.",
                            218: "Ecuador", 222: "El Salvador", 320: "Guatemala", 328: "Guyana",
                            332: "Haiti", 340: "Honduras", 388: "Jamaica", 484: "Mexico",
                            558: "Nicaragua", 591: "Panama", 600: "Paraguay", 604: "Peru",
                            630: "Puerto Rico", 740: "Suriname", 780: "Trinidad and Tobago",
                            858: "Uruguay", 862: "Venezuela", 84: "Belize"
                        };

                        const filteredFeatures = geojson.features.filter(f => {
                            const id = parseInt(f.id);
                            return idToName[id] !== undefined;
                        });

                        filteredFeatures.forEach(f => {
                            f.properties.name = idToName[parseInt(f.id)];
                        });

                        geojsonLayer = L.geoJSON({ type: "FeatureCollection", features: filteredFeatures }, {
                            style: featureStyle,
                            onEachFeature: onEachFeature
                        }).addTo(map);

                        addLabels();
                        updateRanking();
                        buildLegend();

                        // Ocultar loading
                        document.getElementById('loadingOverlay').style.display = 'none';
                    });
            })
            .catch(err => {
                console.error('Error cargando mapa:', err);
                document.getElementById('loadingOverlay').innerHTML =
                    '<div style="text-align:center;color:white">Error cargando el mapa.<br>Verifica tu conexión a internet.</div>';
            });

        function featureStyle(feature) {
            const name = feature.properties.name;
            const count = youtuberData[name] || 0;
            return {
                fillColor: getColor(count),
                weight: 1.5,
                opacity: 1,
                color: '#555',
                fillOpacity: 0.85
            };
        }

        function onEachFeature(feature, layer) {
            const name = feature.properties.name;
            if (!name) return;

            countryLayers[name] = layer;
            const label = displayNames[name] || name;
            const count = youtuberData[name] || 0;

            layer.bindTooltip(
                `<strong>${label}</strong><br/>YouTubers: <strong>${count.toLocaleString()}</strong>`,
                { sticky: true, direction: 'top', offset: [0, -10] }
            );

            layer.on({
                mouseover: function(e) {
                    e.target.setStyle({ weight: 3, color: '#222', fillOpacity: 0.95 });
                    e.target.bringToFront();
                },
                mouseout: function(e) {
                    geojsonLayer.resetStyle(e.target);
                },
                click: function() {
                    openModal(name);
                }
            });
        }

        function addLabels() {
            labelMarkers.forEach(m => map.removeLayer(m));
            labelMarkers = [];
            for (const [name, coords] of Object.entries(countryCoords)) {
                const count = youtuberData[name] || 0;
                const marker = L.marker(coords, {
                    icon: L.divIcon({
                        className: 'country-label',
                        html: count.toLocaleString(),
                        iconSize: [50, 18],
                        iconAnchor: [25, 9]
                    }),
                    interactive: false
                }).addTo(map);
                labelMarkers.push(marker);
            }
        }

        function openModal(name) {
            currentEditCountry = name;
            const label = displayNames[name] || name;
            document.getElementById('editTitle').textContent = label;
            document.getElementById('editInput').value = youtuberData[name] || 0;
            document.getElementById('editModal').classList.add('active');
            document.getElementById('editInput').focus();
            document.getElementById('editInput').select();
        }

        function closeModal() {
            document.getElementById('editModal').classList.remove('active');
            currentEditCountry = null;
        }

        function saveEdit() {
            const val = parseInt(document.getElementById('editInput').value) || 0;
            youtuberData[currentEditCountry] = Math.max(0, val);

            const layer = countryLayers[currentEditCountry];
            if (layer) {
                layer.setStyle(featureStyle(layer.feature));
                const label = displayNames[currentEditCountry] || currentEditCountry;
                layer.setTooltipContent(
                    `<strong>${label}</strong><br/>YouTubers: <strong>${val.toLocaleString()}</strong>`
                );
            }

            addLabels();
            updateRanking();
            closeModal();
        }

        document.getElementById('editInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') saveEdit();
            if (e.key === 'Escape') closeModal();
        });

        // Cerrar modal al clic fuera
        document.getElementById('editModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        function updateRanking() {
            const entries = Object.entries(youtuberData).filter(([k]) => displayNames[k]);
            const sorted = entries.sort((a, b) => b[1] - a[1]);
            const list = document.getElementById('rankingList');
            let total = 0;
            list.innerHTML = sorted.map(([name, count]) => {
                total += count;
                const label = displayNames[name] || name;
                return `<div class="country-row" onclick="openModal('${name}')">
                    <span class="country-name">${label}</span>
                    <span class="country-count">${count.toLocaleString()}</span>
                </div>`;
            }).join('');
            document.getElementById('totalCount').textContent = total.toLocaleString();
        }

        function buildLegend() {
            const grades = [
                { min: 1000, label: '1,000+' },
                { min: 500, label: '500 – 999' },
                { min: 300, label: '300 – 499' },
                { min: 200, label: '200 – 299' },
                { min: 100, label: '100 – 199' },
                { min: 50, label: '50 – 99' },
                { min: 20, label: '20 – 49' },
                { min: 1, label: '1 – 19' },
                { min: 0, label: '0' },
            ];
            document.getElementById('legend').innerHTML = '<h4>YouTubers</h4>' + grades.map(g =>
                `<div class="legend-item">
                    <div class="legend-color" style="background:${getColor(g.min)}"></div>
                    ${g.label}
                </div>`
            ).join('');
        }
    </script>
</body>
</html>
