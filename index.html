<style>
/* Layout: franja de cancha arriba; cromo del jugador a la izquierda y mesa de decisiones a la derecha; historial abajo. */
:root{
  --bg:#edf3ea; --surface:#ffffff; --sunk:#e3ece1; --ink:#0f1f18; --muted:#4d6157; --line:#cddbcc;
  --pitch:#16794a; --pitch2:#1f8f58; --pitch-ink:#ffffff; --gold:#f2b705; --gold-ink:#2a1f00;
  --sky:#1d6ad6; --coral:#e2502a; --teal:#0b8f9b; --rose:#c42e62;
  --gold-soft:#fff2c2; --sky-soft:#e0ebff; --coral-soft:#ffe3d9; --teal-soft:#d6f3f4; --green-soft:#d9f2e2; --rose-soft:#fde0ea;
  --good:#167a3e; --warn:#a35f00; --bad:#b52a22;
  --f-display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a140f; --surface:#122019; --sunk:#192b21; --ink:#ebf3ed; --muted:#9db1a5; --line:#28402f;
  --pitch:#17703f; --pitch2:#1d7f4a; --pitch-ink:#ffffff; --gold:#ffc928; --gold-ink:#231a00;
  --sky:#6aa6ff; --coral:#ff8a66; --teal:#40c9d3; --rose:#ff7aa5;
  --gold-soft:#3a2f08; --sky-soft:#13284a; --coral-soft:#43200f; --teal-soft:#0e3338; --green-soft:#123d26; --rose-soft:#421628;
  --good:#5fd08f; --warn:#f0ad45; --bad:#ff7d72; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a140f; --surface:#122019; --sunk:#192b21; --ink:#ebf3ed; --muted:#9db1a5; --line:#28402f;
  --pitch:#17703f; --pitch2:#1d7f4a; --pitch-ink:#ffffff; --gold:#ffc928; --gold-ink:#231a00;
  --sky:#6aa6ff; --coral:#ff8a66; --teal:#40c9d3; --rose:#ff7aa5;
  --gold-soft:#3a2f08; --sky-soft:#13284a; --coral-soft:#43200f; --teal-soft:#0e3338; --green-soft:#123d26; --rose-soft:#421628;
  --good:#5fd08f; --warn:#f0ad45; --bad:#ff7d72; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5}
.band{background:repeating-linear-gradient(90deg,var(--pitch) 0 72px,var(--pitch2) 72px 144px);color:var(--pitch-ink);border-bottom:5px solid var(--gold);position:relative;overflow:hidden}
.band::after{content:"";position:absolute;right:-60px;top:50%;width:200px;height:200px;border:3px solid rgba(255,255,255,.35);border-radius:50%;transform:translateY(-50%);pointer-events:none}
.gear{background:var(--gold);color:var(--gold-ink);border:0;border-radius:99px;padding:8px 18px;font-weight:800;font-size:15px;cursor:pointer}
.gear:focus-visible{outline:3px solid #fff;outline-offset:2px}
.settings[hidden]{display:none!important}
.settings{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.set-card{background:var(--surface);color:var(--ink);border-radius:16px;padding:24px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:14px;max-height:100%;overflow:auto}
.err{color:var(--bad);font-size:14px;font-weight:700;text-transform:none;letter-spacing:0}
.reset-box{display:flex;flex-direction:column;gap:8px;background:var(--coral-soft);border-radius:12px;padding:14px}
#set-reset-yes{background:var(--bad)}
.set-card h2{font-family:var(--f-display);font-size:30px;margin:0;text-transform:uppercase}
.set-card label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.band .in{max-width:1320px;margin:0 auto;padding-inline:16px;padding-block:22px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;position:relative;z-index:1}
.brand{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,6vw,52px);letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand span{color:var(--gold)}
.tag{font-size:15px;font-weight:600;opacity:.92}
.wrap{max-width:1320px;margin:0 auto;padding-inline:16px;padding-block:24px 56px;display:flex;flex-direction:column;gap:24px}
button{font:inherit;color:inherit}
.btn{background:var(--coral);color:#fff;border:0;border-radius:8px;padding:14px 26px;font-weight:800;font-size:18px;cursor:pointer;letter-spacing:.02em}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.small{padding:8px 14px;font-size:15px}
.rk{position:fixed;inset:0;z-index:900;background:rgba(4,7,14,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.rk-card{background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:20px;width:min(100%,440px);max-height:86vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.rk-card h2{margin:0;font-family:var(--f-display);text-transform:uppercase}
.rk-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rk-list li{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:8px;background:var(--sunk)}
.rk-list li.me{outline:2px solid var(--gold)}
.rk-pos{font-family:var(--f-display);font-weight:800;font-size:20px;width:28px;text-align:center}
.rk-name{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:600}
.rk-pts{font-variant-numeric:tabular-nums}
.rk-set{display:flex;flex-direction:column;gap:8px}
.a3d{position:fixed;inset:0;z-index:1000;background:rgba(4,7,14,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
.a3d-stage{position:relative;width:min(100%,1100px,calc((100vh - 110px)*16/9));aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
@media (max-aspect-ratio:1/1){.a3d-stage{width:100%;aspect-ratio:auto;height:min(74vh,150vw)}}
.a3d canvas{display:block;width:100%;height:100%}
.a3d-cap{position:absolute;left:10px;right:10px;bottom:7%;text-align:center;font-family:var(--f-display,"Saira Condensed",sans-serif);font-weight:800;text-transform:uppercase;letter-spacing:.03em;font-size:clamp(22px,4.6vw,48px);line-height:1.05;color:#fff;text-shadow:0 3px 18px rgba(0,0,0,.85);pointer-events:none;transition:opacity .35s,transform .35s}
.a3d-cap.gold{color:#f2b705}.a3d-cap.off{opacity:0;transform:translateY(8px)}
.a3d-bar{display:flex;gap:10px}
.a3d .btn.ghost{color:#fff;border-color:rgba(255,255,255,.45)}
.chk{display:flex!important;flex-direction:row!important;align-items:center;gap:10px}
.chk input{width:20px;height:20px}

.btn:focus-visible,.choice:focus-visible,select:focus-visible,input:focus-visible,.tabs button:focus-visible,.cant:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* inicio */
.start{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:24px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;min-width:0}
.panel h2,.sec-h{font-family:var(--f-display);font-size:30px;margin:0 0 4px;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance;line-height:1.05}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
.form label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);min-width:0}
.form .full{grid-column:1/-1}
input,select{background:var(--bg);border:2px solid var(--line);border-radius:8px;padding:11px 12px;font:inherit;font-size:17px;color:var(--ink);text-transform:none;letter-spacing:0;width:100%;min-width:0}
.note{color:var(--muted);font-size:15px}
.rules{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.flag{display:flex;height:12px;border-radius:3px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.flag i{flex:1}
.cants-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.cants{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:1250px){.cants{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cant{text-align:left;background:var(--surface);border:3px solid var(--line);border-radius:14px;padding:0;cursor:pointer;display:flex;flex-direction:column;overflow:hidden;min-width:0;transition:transform .15s,border-color .15s}
.cant:hover{transform:translateY(-2px)}
.cant[aria-pressed="true"]{border-color:var(--coral);box-shadow:0 6px 0 var(--coral-soft)}
.cant .top{padding:14px 18px;color:#fff;font-family:var(--f-display);font-weight:800;font-size:18px;text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between;align-items:center}
.cant.t0 .top{background:var(--rose)} .cant.t1 .top{background:var(--sky)} .cant.t2 .top{background:var(--teal)} .cant.t3 .top{background:#6a3fb5}
.cant .top b{background:rgba(255,255,255,.25);border-radius:6px;padding:2px 10px;font-size:20px}
.cant .bd{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.cant .cn{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;text-wrap:balance}
.cant ul{margin:0;padding-left:18px;font-size:15px;display:flex;flex-direction:column;gap:4px}
.startbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* juego */
.game{display:grid;grid-template-columns:340px minmax(0,1fr);gap:24px;align-items:start}
.cromo{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.cromo .head{background:repeating-linear-gradient(90deg,var(--pitch) 0 40px,var(--pitch2) 40px 80px);color:var(--pitch-ink);padding:20px 18px 18px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end;position:relative}
.cromo .num{font-family:var(--f-display);font-weight:800;font-size:90px;line-height:.8;opacity:.22;position:absolute;right:100px;top:12px}
.cromo .nm{font-family:var(--f-display);font-weight:800;font-size:32px;line-height:1;text-transform:uppercase;text-wrap:balance}
.cromo .ps{font-size:15px;font-weight:600;opacity:.95;margin-top:6px}
.ovr{background:var(--gold);color:var(--gold-ink);border-radius:10px;min-width:80px;padding-inline:10px!important;text-align:center;padding:8px 0 6px;font-family:var(--f-display);line-height:1;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.ovr.cobre{background:linear-gradient(135deg,#e7a46b 0%,#b8692e 45%,#f0b98a 60%,#8a4b1f 100%);color:#2b1305}
.ovr.plata{background:linear-gradient(135deg,#f4f6f8 0%,#b9c2cc 40%,#ffffff 55%,#8e98a3 100%);color:#1d2530}
.ovr.dia{background:linear-gradient(135deg,#dff6ff 0%,#9ee4ff 30%,#ffffff 48%,#8fd8f7 62%,#e8fbff 100%);background-size:220% 220%;color:#05324a;box-shadow:0 4px 0 rgba(0,0,0,.2),0 0 14px rgba(120,220,255,.75);animation:shine 4s linear infinite}
.ovr.obs{background:linear-gradient(135deg,#07070c 0%,#1d1530 35%,#3b2a63 50%,#140f22 65%,#050508 100%);background-size:220% 220%;color:#efe8ff;box-shadow:0 4px 0 rgba(0,0,0,.35),0 0 16px rgba(140,100,255,.7);border:1px solid #8a6cff;animation:shine 5s linear infinite}
.ovr.obs b{text-shadow:0 0 8px rgba(170,140,255,.8)}
@keyframes shine{from{background-position:0% 0%}to{background-position:220% 220%}}
.ovr.god{background:conic-gradient(from 0deg,#fff6c2,#ffd54a,#ff9f1c,#fff6c2,#ffe27a,#ffffff,#fff6c2);color:#3a2300;box-shadow:0 4px 0 rgba(0,0,0,.25),0 0 22px rgba(255,210,80,.95),0 0 44px rgba(255,180,40,.55);border:2px solid #fff3b0;animation:godpulse 2.4s ease-in-out infinite}
.ovr.god b{text-shadow:0 0 10px rgba(255,255,255,.9)}
.cromo.god{border:2px solid #f2c94c;box-shadow:0 0 28px rgba(242,201,76,.55)}
.cromo.god .head{background:radial-gradient(circle at 75% 40%,rgba(255,236,150,.55),transparent 55%),repeating-conic-gradient(from 0deg at 75% 40%,#1a1206 0deg 8deg,#2b1d07 8deg 16deg);color:#fff4cf}
.god-tag{position:absolute;top:10px;left:18px;font-family:var(--f-display);font-weight:800;font-size:13px;letter-spacing:.2em;color:#3a2300;background:linear-gradient(90deg,#ffe27a,#fff6c2,#ffd54a);padding:3px 10px;border-radius:99px;box-shadow:0 0 12px rgba(255,210,80,.8)}
.cromo.god .nm{margin-top:18px}
@keyframes godpulse{0%,100%{box-shadow:0 4px 0 rgba(0,0,0,.25),0 0 18px rgba(255,210,80,.8),0 0 36px rgba(255,180,40,.4)}50%{box-shadow:0 4px 0 rgba(0,0,0,.25),0 0 30px rgba(255,230,120,1),0 0 60px rgba(255,190,60,.7)}}
.ovr b{display:block;font-size:48px;font-weight:800}
.ovr small{font-size:12px;font-weight:800;letter-spacing:.12em}
.cromo .body{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:16px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;min-width:0}
.meter{display:flex;flex-direction:column;gap:5px;font-size:13px}
.meter .lab{display:flex;justify-content:space-between;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.bar{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%}
.bar.m1 i{background:var(--coral)} .bar.m2 i{background:var(--sky)} .bar.m3 i{background:var(--gold)} .bar.m4 i{background:var(--rose)}
.memes li{background:var(--rose-soft);border-radius:10px;padding:10px 14px}

.scene{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:18px;min-width:0}
.kicker{align-self:flex-start;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:#fff;background:var(--pitch);padding:4px 10px;border-radius:6px}
.scene h2{font-family:var(--f-display);font-weight:800;font-size:clamp(32px,5vw,46px);line-height:1;margin:0;text-transform:uppercase;text-wrap:balance}
.scene .txt{max-width:68ch;display:flex;flex-direction:column;gap:12px;font-size:18px}
.scene .txt p{margin:0}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.choice{text-align:left;border:2px solid transparent;border-radius:12px;padding:16px 18px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0;transition:transform .15s,border-color .15s}
.choice:nth-child(4n+1){background:var(--green-soft)} .choice:nth-child(4n+2){background:var(--sky-soft)}
.choice:nth-child(4n+3){background:var(--gold-soft)} .choice:nth-child(4n+4){background:var(--coral-soft)}
.choice:hover{border-color:var(--ink);transform:translateY(-2px)}
.choice .cl{font-weight:800;font-size:19px}
.choice .cd{font-size:15px;color:var(--muted)}
.choice .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{display:inline-flex;align-items:center;font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--surface);color:var(--ink);white-space:nowrap;border:1px solid var(--line)}
.chip.good{background:var(--good);color:var(--surface);border-color:transparent} .chip.bad{background:var(--bad);color:var(--surface);border-color:transparent} .chip.warn{background:var(--warn);color:var(--surface);border-color:transparent}
.chip.up{background:var(--gold);color:var(--gold-ink);border-color:transparent;font-size:15px;padding:4px 12px}
.chip.gold{background:var(--gold);color:var(--gold-ink);border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.statline{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{border-radius:12px;padding:14px 16px;background:var(--sunk)}
.stat:nth-child(1){background:var(--coral-soft)} .stat:nth-child(2){background:var(--sky-soft)} .stat:nth-child(3){background:var(--gold-soft)} .stat:nth-child(4){background:var(--teal-soft)} .stat:nth-child(5){background:var(--green-soft)}
.stat b{display:block;font-family:var(--f-display);font-size:clamp(26px,4vw,38px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:17px}
.list li{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tw{color:var(--good);font-weight:800}.tl{color:var(--bad);font-weight:800}

.ledger{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;min-width:0}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{background:var(--sunk);border:0;padding:9px 16px;font-weight:800;color:var(--muted);cursor:pointer;border-radius:99px;font-size:16px}
.tabs button[aria-selected="true"]{color:#fff;background:var(--sky)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:16px;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:nth-child(even){background:var(--bg)}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800}
th:nth-child(-n+3),td:nth-child(-n+3){text-align:left}
td.g{color:var(--coral);font-weight:800}
tfoot td{font-weight:800;border-bottom:0}
td .lg{color:var(--muted);font-size:13px;display:block}
.bo-hero{display:flex;justify-content:space-between;align-items:center;gap:16px;background:var(--gold);color:var(--gold-ink);border-radius:14px;padding:18px 22px;margin-bottom:12px}
.bo-hero .kicker{background:rgba(0,0,0,.15)!important;color:var(--gold-ink)!important}
.bo-years{font-family:var(--f-display);font-weight:800;font-size:clamp(22px,4vw,30px);margin-top:6px}
.bo-hero b{font-family:var(--f-display);font-size:64px;line-height:1}
.ctag{display:inline-flex;align-items:center;gap:6px;vertical-align:middle;min-width:0}
.ctag .crest{flex:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.2))}
.ctag.big{gap:10px}
.kv dd .ctag{justify-content:flex-end}
.wheel-wrap{position:relative;width:min(300px,80vw);margin:4px auto 0}
.wheel{width:100%;height:auto;display:block;transform-origin:50% 50%}
.wheel-ptr{position:absolute;left:50%;top:-6px;width:30px;height:24px;transform:translateX(-50%);z-index:2}
.hist{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.hcard{background:var(--bg);border-radius:12px;border:1px solid var(--line)}
.hcard summary{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;list-style:none}
.hcard summary::-webkit-details-marker{display:none}
.hmain{display:flex;flex-direction:column;min-width:0;flex:1}
.htier{font-family:var(--f-display);font-weight:800;font-size:28px;text-align:center;line-height:1}
.htier small{display:block;font-size:11px;letter-spacing:.1em;color:var(--muted)}
.hbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.troph{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.troph div{background:var(--gold-soft);border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;gap:8px}
.troph div.aw{background:var(--sky-soft)}
.troph b{font-family:var(--f-display);font-size:28px}
.news{display:flex;flex-direction:column;gap:10px;font-size:16px}
.news div{display:flex;gap:12px}.news time{color:var(--muted);font-variant-numeric:tabular-nums;min-width:62px;font-weight:700}
.empty{color:var(--muted)}
.row-actions{display:flex;gap:10px;flex-wrap:wrap}

.cmp{background:var(--bg);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px}
.cmp h3{font-family:var(--f-display);font-size:30px;margin:8px 0 2px;text-transform:uppercase;line-height:1.05;text-wrap:balance}
.cmp-g{display:flex;flex-direction:column;gap:6px}
.cmp-g .lab{display:flex;justify-content:space-between;font-weight:700;font-size:15px;margin-top:6px}
.cmpbar{height:12px;background:var(--sunk);border-radius:6px;overflow:hidden}.cmpbar i{display:block;height:100%}
.cmpbar i.me{background:var(--coral)}.cmpbar i.ref{background:var(--sky)}
.me-t{color:var(--coral)}.ref-t{color:var(--sky)}
.ai{background:var(--rose-soft);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px}
.ai h3{font-family:var(--f-display);font-size:30px;margin:8px 0 0;text-transform:uppercase;line-height:1.05;text-wrap:balance}
.ai .btn[disabled]{opacity:.7;cursor:progress}
.aitab{background:var(--surface);border-radius:10px}.aitab td,.aitab th{text-align:left;white-space:normal}
.aicols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.aicols ul{margin:6px 0 0;padding-left:18px}

.maincol{display:flex;flex-direction:column;gap:20px;min-width:0}
.mnav{display:none}
.scards{display:none}
@media (max-width:820px){
  body{font-size:16px}
  .band .in{padding-block:12px;flex-wrap:nowrap;align-items:center}
  .tag{display:none}
  .brand{font-size:30px}
  .gear{padding:7px 14px;font-size:14px;flex:none}
  .statline{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .stat{padding:10px 12px}
  .stat b{font-size:26px}
  .stat span{font-size:11px}
  .wrap{padding-block:16px 110px}
  .game{gap:16px}
  .game[data-mv="opciones"] .cromo,.game[data-mv="opciones"] .ledger{display:none}
  .game[data-mv="temporadas"] .cromo,.game[data-mv="temporadas"] .scene{display:none}
  .game[data-mv="general"] .maincol{display:none}
  .game[data-mv="general"] .cromo{order:0}
  .scene{padding:18px;gap:14px}
  .scene h2{font-size:32px}
  .scene .txt{font-size:17px}
  .choices{grid-template-columns:minmax(0,1fr)}
  .choice{padding:16px;min-height:64px}
  .ledger .scroll{display:none}
  .scards{display:flex;flex-direction:column;gap:10px}
  .scard{background:var(--bg);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
  .scard.tot{background:var(--gold-soft)}
  .sc-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
  .sc-h b{font-family:var(--f-display);font-size:20px}
  .sc-h span{font-weight:700}
  .sc-h em{font-style:normal;color:var(--muted);font-size:14px}
  .sc-s{display:grid;grid-template-columns:repeat(auto-fit,minmax(52px,1fr));gap:6px;text-align:center}
  .sc-s span{display:flex;flex-direction:column;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .sc-s b{font-family:var(--f-display);font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:0}
  .sc-s .gg b{color:var(--coral)}
  .mnav{display:grid;grid-template-columns:repeat(3,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 16px rgba(0,0,0,.08)}
  .mnav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:12px;color:var(--muted);font-weight:800;font-size:13px;cursor:pointer}
  .mnav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .mnav button[aria-pressed="true"]{background:var(--green-soft);color:var(--pitch)}
  .mnav button:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
}
@media (max-width:900px){
  .start,.game{grid-template-columns:minmax(0,1fr)}

function roleKey(p,club){let d=p.ovr-club.s+(p.coach-50)/20+(p.morale-60)/60-[-1.5,0,1,2][DF()];if(typeof S!=='undefined'&&S&&S.p&&S.sm&&S.sm.comp&&club.n===S.p.club&&S.sm.comp.ovr>p.ovr)d-=3.5;if(p.age<=19)d-=1;if(p.age<=16)d-=1;if(p.ctier>=1&&club.n===p.cantera&&p.age<=18)d=Math.max(d,p.ctier>=2?-4.5:-8.5);
 return d>=3?'estrella':d>=-1.5?'titular':d>=-4.5?'rotacion':d>=-8.5?'suplente':'reserva'}
function roleFor(p,club){return roleKey({...p,coach:50,morale:Math.max(60,p.morale)},club)}

const effO=o=>o<=92?o:92+(o-92)*.12;
function gf(o){const c=o<90?1:o<110?1-(o-90)/20*.25:o<130?.6:o<160?.3:.15;return c*[1.3,1,.7,.5][DF()]}
function marketValue(ovr,age){ovr=effO(ovr);const af=age<=21?1.5:age<=25?1.2:age<=28?1:age<=30?.7:age<=32?.45:.25;return Math.pow(10,(ovr-50)/12)*5e4*af}
function salaryFor(ovr,age,club){ovr=effO(ovr);const lg=L[club.l];let s=Math.pow(10,(ovr-55)/13)*2e4*lg.w;s*=clamp(1+(club.s-lgAvg(club.l))*.03,.8,1.35);if(age<=19)s*=.6;return round(s/1000)*1000}

function trophy(name,cat){S.trophies.push({y:S.year,n:name,cat});
 const isMain=Object.values(CONT).some(c=>c.main===name);
 const base=cat==='liga'?3:cat==='copa'?2:cat==='int'?(isMain?4:3):cat==='asc'?1:cat==='sel'?(/Mundial/.test(name)?5:/Copa Oro/.test(name)?2:4):0;
 if(base&&S.sm){const b=S.p.ovr;fx({ovr:base});(S.sm.tUp=S.sm.tUp||[]).push({n:name,up:S.p.ovr-b})}}

const LBL={morale:'moral',coach:'relación con el DT',rep:'fama',prof:'profesionalismo',money:'dinero',ovr:'media',growth:'progresión',inj:'riesgo de lesión',miss:'partidos perdidos',goal:'olfato de gol'};
function fx(d){const p=S.p,chips=[];
 for(const k in d){const v=d[k];if(!v)continue;
  if(['growth','inj','miss'].includes(k)){S.sm[k]+=v;const good=k==='growth'?v>0:v<0;chips.push({t:(k==='miss'?'se pierde '+round(v*100)+'% de la mitad':(v>0?'más ':'menos ')+LBL[k]),c:good?'good':'bad'})}
  else if(k==='goal'){S.sm.goal*=v;chips.push({t:(v>1?'más ':'menos ')+'aporte ofensivo',c:v>1?'good':'bad'})}
  else if(k==='money'){p.money=Math.max(0,p.money+v);chips.push({t:(v>0?'+':'−')+fmtM(Math.abs(v)),c:v>0?'good':'bad'})}
  else if(k==='ovr'){if(v>0){const b=p.ovr;let gn=v*gf(b)*(p.age>30?.5:1);gn=Math.floor(gn)+(R()<gn%1?1:0);p.ovr=Math.min(180,p.ovr+gn);const up=p.ovr-b;p.peak=Math.max(p.peak||0,p.ovr);chips.push(up>0?{t:'+'+up+' media',c:'good',ovr:1}:{t:p.ovr>=180?'ya estás en 180':'esta vez no subiste',c:'warn'})}else{p.ovr+=v;chips.push({t:'−'+Math.abs(v)+' media',c:'bad'})}}
  else if(k==='pot'){p.pot+=v}
  else{p[k]=clamp(p[k]+v,0,100);chips.push({t:(v>0?'+':'−')+Math.abs(v)+' '+LBL[k],c:v>0?'good':'bad'})}}
 return chips}

function simTourney(T){const p=S.p,n=NAT[p.nat];const boost=clamp((p.ovr-n.s)*.12,-.5,1.5);const res=[];let gTot=0,champ=false;
 for(let i=0;i<T.st.length;i++){const gp=i===0?3:1;const pr=1/(1+Math.exp(-((n.s+boost-T.opp[i]+(i===0?4:0))/3.2)));const won=R()<pr;
  const g=p.pos==='POR'?0:Math.max(0,round(POS[p.pos].g*gp*.85*Math.exp(.05*(p.ovr-82))*rnd(.3,1.8)));gTot+=g;
  res.push({st:T.st[i],won,g});if(!won)break;if(i===T.st.length-1)champ=true}
 S.nt.g+=gTot;S.nt.caps+=res.reduce((s,r,i)=>s+(i===0?3:1),0);
 let tUp=0;if(champ){const b0=p.ovr;trophy(T.n.replace(/ \d+$/,''),'sel');tUp=p.ovr-b0;news(`¡Campeón de la ${T.n} con ${p.nat}!`);p.rep=clamp(p.rep+12,0,100)}

function topSeasons(){return S.rows.filter(r=>['ESP','ENG','ITA','GER','FRA'].includes(r.l)&&r.pj>=20).length}
function elite(c,p){const cur=CL[p.club]||{s:60};const nota=S.lastNota||6.5;const fame=p.rep;
 if(c.s>=84){ // gigantes: trayectoria probada
  if(p.ovr<c.s+3||fame<70||nota<7.3||topSeasons()<(c.s>=86?2:1)||p.age<22)return false;
  if(c.s-cur.s>6&&fame<90)return false;return R()<.5}
 if(c.s>=80){if(p.ovr<c.s+1||fame<50||nota<7.0)return false;if(c.s-cur.s>8)return false;return R()<.7}
 return p.ovr>=c.s-2&&c.s-cur.s<=10}
function accessible(c,p){if(!elite(c,p))return false;return leagueOk(c,p)}
function leagueOk(c,p){const lg=L[c.l];if(lg.cf==='AS')return p.age>=26&&p.ovr>=73;
 if(['ESP','ENG','ITA','GER','FRA'].includes(c.l))return p.ovr>=69||p.rep>=55;if(lg.eu)return p.ovr>=64;return true}
function affinity(c,p){const lg=L[c.l],home=L[CL[p.club].l];let w=1;if(lg.c===(p.home||p.nat))w*=1.6;if(lg.cf&&lg.cf===NAT[p.nat].cf)w*=1.2;if(lg.c===home.c)w*=1.3;
 if(p.ovr>=74&&lg.cf==='EU')w*=1.6;if(lg.cf==='AS')w*=S.sm.saudi?6:.5;return w}
function makeOffer(c,p,type){const rk=roleFor(p,c);const sal=round(salaryFor(p.ovr,p.age,c)*rnd(1,1.25)/1000)*1000;
 return{club:c.n,l:c.l,s:c.s,type,years:type==='loan'?1:clamp(ri(2,5)-(p.age>=31?2:0),1,5),salary:type==='loan'?p.salary:Math.max(sal,type==='free'?0:p.salary),role:rk,fee:type==='transfer'?round(marketValue(p.ovr,p.age)*rnd(.9,1.4)/1e4)*1e4:0}}
function fillOffers(out,min){const p=S.p,eo=Math.min(p.ovr,108),free=p.contract<=0&&!p.loan;
 const pool=CLUBS.filter(c=>c.n!==p.club&&(!p.loan||c.n!==p.loan.parent)&&!out.some(o=>o.club===c.n)&&accessible(c,p)&&c.s<=eo+1);
 const tgt=pool.length?Math.min(eo-2,Math.max(...pool.map(c=>c.s))):0;
 while(out.length<min&&pool.length){const c=wpick(pool,x=>Math.exp(-Math.abs(x.s-tgt)/4)*affinity(x,p));if(!c)break;pool.splice(pool.indexOf(c),1);out.push(makeOffer(c,p,free?'free':'transfer'))}return out}
function genOffers(kind){const p=S.p,cur=CL[p.club];const jump=-[-1.5,0,1,2][DF()]+Math.min(6,1+p.rep/35+(p.agentTop?1.5:0)+((S.lastNota||6.8)>=7.3?1.5:0));
 const free=kind==='summer'&&p.contract<=0&&!p.loan;
 let cand=CLUBS.filter(c=>c.n!==p.club&&(!p.loan||c.n!==p.loan.parent)&&accessible(c,p));
 const eo=Math.min(p.ovr,108);
 if(kind==='summer'){const cs=cur.s,pool=cand.filter(c=>c.s<=Math.max(eo+Math.max(jump,2),cs+4)),out=[];
  const good=pool.filter(c=>c.s>=cs+2),mid=CLUBS.filter(c=>c.n!==p.club&&(!p.loan||c.n!==p.loan.parent)&&Math.abs(c.s-cs)<=2&&p.ovr>=c.s-3&&leagueOk(c,p));
  const pf=(arr,tgt)=>{const a=arr.filter(c=>!out.some(o=>o.club===c.n));return a.length?wpick(a,x=>Math.exp(-Math.abs(x.s-tgt)/3)*affinity(x,p)):null};
  const typ=c=>free?'free':(p.age<=22&&c.s-p.ovr>=0&&R()<.35)?'loan':'transfer';
  for(const [arr,tgt] of [[good,cs+6],[good,cs+3],[mid,cs]]){const c=pf(arr,tgt)||pf(pool,tgt);if(c)out.push(makeOffer(c,p,typ(c)))}
  const extra=p.rep>=70&&roleFor(p,cur)==='estrella'?ri(0,2):0;for(let i=0;i<extra;i++){const c=pf(pool,eo);if(c)out.push(makeOffer(c,p,typ(c)))}
  fillOffers(out,3);if(free&&!out.length){const low=CLUBS.filter(c=>c.s<=p.ovr+1).sort((a,b)=>b.s-a.s).slice(0,6);if(low.length)out.push(makeOffer(pick(low),p,'free'))}return out}
 if(kind==='winter')cand=cand.filter(c=>c.s<=eo+1&&c.s>=eo-4);
 else cand=cand.filter(c=>c.s<=eo+jump&&c.s>=eo-(free?14:8));
 let n=kind==='winter'?2:clamp(1+(p.rep>45?1:0)+(p.agentTop?1:0)+((S.lastNota||6.6)>=7?1:0)+(free?1:0)+(R()<.5?1:0),1,5);if(kind==='summer')n=Math.max(3,p.rep>=70&&roleFor(p,CL[p.club])==='estrella'?n:3);
 const out=[];const used=new Set();
 for(let i=0;i<n&&cand.length;i++){const c=wpick(cand.filter(x=>!used.has(x.n)),x=>Math.exp(-Math.abs(x.s-(eo+1))/3)*affinity(x,p));if(!c)break;used.add(c.n);
  const type=kind==='winter'||(p.age<=22&&c.s-p.ovr>=0&&R()<.35&&!free)?'loan':free?'free':'transfer';out.push(makeOffer(c,p,type))}
 if(kind==='summer')fillOffers(out,3);
 if(free&&!out.length){const low=CLUBS.filter(c=>c.s<=p.ovr+1).sort((a,b)=>b.s-a.s).slice(0,6);if(low.length)out.push(makeOffer(pick(low),p,'free'))}
 return out}

 (o,n)=>`Meme viral: tu cara con la camiseta de ${n} y el texto "cuando el sueldo pesa más que el escudo".`,(o,n)=>`En ${o} cambiaron tu nombre en el mural por "Se busca: traidor".`,
 (o,n)=>`Un streamer hizo una canción sobre ti: "Se fue a ${n} por la plata" ya es tendencia.`,(o,n)=>`Los de ${n} tampoco te creen: "a ver cuánto le dura el amor".`,
 (o,n)=>`Alguien imprimió tu foto en papel higiénico y lo venden afuera del estadio de ${o}.`,(o,n)=>`Tu mamá dice que ya no la saludan en la tienda del barrio.`,
 (o,n)=>`Encuesta en redes: "¿${S.p.name} es el mayor traidor de la historia?" Sí: 87%.`,(o,n)=>`Los periodistas de ${o} juran que tu gol de despedida fue "en fuera de lugar".`];
function rivalMove(club,next){const p=S.p,old=rivalOf(club);if(!old)return false;
 const cantera=old===p.cantera;const up=cantera?ri(40,55):ri(28,40);p.pol=clamp((p.pol||1)+up,1,100);
 news(`Polémica: fichaste por ${club}, rival directo de ${old}.`);
 const memes=MEMES.slice().sort(()=>R()-.5).slice(0,3).map(f=>f(old,club));
 const ch=[{t:'+'+up+' polémica',c:'bad'}].concat(fx({rep:6,morale:-6}));
 show('polemica',{club,old,cantera,memes,ch,next});return true}

function show(k,data){S.step={k,data:data||{}};save();render()}
function chipsHTML(ch){return ch&&ch.length?`<div class="chips">${ch.map(c=>`<span class="chip ${c.ovr?'up':c.c||''}">${esc(c.t)}</span>`).join('')}</div>`:''}
function roleChip(rk){return `<span class="chip ${ROLES[rk].cls}">${ROLES[rk].n}</span>`}
function label(){const p=S.p;return 'Temporada '+seasonLabel(S.year,CL[p.club].l)}

function sceneHTML({kicker,title,body,choices}){return `<section class="scene" aria-live="polite"><div class="kicker">${kicker}</div><h2>${title}</h2><div class="txt">${body||''}</div>

function wheelSVG(segs,rot){const tot=segs.reduce((a,x)=>a+x.w,0);let a0=-90,out='';const R=120,cx=130,cy=130;
 segs.forEach(sg=>{const ang=sg.w/tot*360,a1=a0+ang,r=Math.PI/180,x0=cx+R*Math.cos(a0*r),y0=cy+R*Math.sin(a0*r),x1=cx+R*Math.cos(a1*r),y1=cy+R*Math.sin(a1*r);
  const mid=(a0+a1)/2*r,tx=cx+R*.62*Math.cos(mid),ty=cy+R*.62*Math.sin(mid);
  out+=`<path d="M${cx} ${cy}L${x0.toFixed(1)} ${y0.toFixed(1)}A${R} ${R} 0 ${ang>180?1:0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}Z" fill="${sg.c}" stroke="#fff" stroke-width="2"/>`+
   `<text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" transform="rotate(${((a0+a1)/2).toFixed(1)} ${tx.toFixed(1)} ${ty.toFixed(1)})" text-anchor="middle" dominant-baseline="middle" font-size="${ang<28?9:11}" font-weight="800" fill="#fff" stroke="rgba(0,0,0,.35)" stroke-width="2" paint-order="stroke" font-family="Barlow, sans-serif">${sg.s}</text>`;
  sg.a0=a0;sg.a1=a1;a0=a1});
 return `<div class="wheel-wrap"><svg class="wheel-ptr" viewBox="0 0 30 24" aria-hidden="true"><path d="M15 24L2 2H28Z" fill="var(--ink)"/></svg><svg id="wheel" class="wheel" viewBox="0 0 260 260"${rot!=null?` style="transform:rotate(${rot}deg)"`:''} role="img" aria-label="Ruleta de la temporada">${out}<circle cx="130" cy="130" r="18" fill="var(--surface)" stroke="var(--ink)" stroke-width="3"/></svg></div>`}

  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;let parts=[],raf=0;
  const size=()=>{cv.width=cv.clientWidth*devicePixelRatio;cv.height=cv.clientHeight*devicePixelRatio};size();addEventListener('resize',size);
  const spawn=()=>{const w=cv.width,h=cv.height;for(let i=0;i<Math.ceil(w/40);i++)parts.push({x:Math.random()*w,y:h+10,vx:(Math.random()-.5)*.6*devicePixelRatio,vy:-(1.2+Math.random()*2.4)*devicePixelRatio,r:(10+Math.random()*22)*devicePixelRatio,life:1,hue:document.documentElement.classList.contains('immortal-mode')?(Math.random()<.55?265+Math.random()*35:38+Math.random()*12):195+Math.random()*30})};

   parts=parts.filter(p=>p.life>0);for(const p of parts){p.x+=p.vx+Math.sin(p.y/30)*.4;p.y+=p.vy;p.life-=.012;p.r*=.985;
    const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);g.addColorStop(0,`hsla(${p.hue+20},100%,${70+p.life*25}%,${.55*p.life})`);g.addColorStop(.5,`hsla(${p.hue},100%,55%,${.3*p.life})`);g.addColorStop(1,`hsla(${p.hue-10},100%,40%,0)`);

   if(parts.length>900)parts.splice(0,parts.length-900);raf=requestAnimationFrame(frame)};
  if(reduce){const g=ctx.createLinearGradient(0,cv.height,0,0);g.addColorStop(0,'rgba(56,189,248,.55)');g.addColorStop(1,'rgba(37,99,235,0)');ctx.fillStyle=g;ctx.fillRect(0,0,cv.width,cv.height)}else frame();

/* =========================================================

    const g=x.createRadialGradient(W/2,H*.42,20,W/2,H*.42,W*.6);g.addColorStop(0,'#3a2a08');g.addColorStop(.45,'#160f22');g.addColorStop(1,'#07060d');x.fillStyle=g;x.fillRect(0,0,W,H);

  // público
  crowd(sc,{rows:7,cols:20,colors:['#1d1b2a','#2a2333','#20263a','#3b2f2a','#14141c'],place:(r,c)=>({x:-7+c*.74+(r%2)*.3,y:r*.22,z:3.2+r*1.05})});
  // personajes

  sc.add(me.root,host.root);host.root.position.set(.55,.8,-.8);host.root.rotation.y=-Math.PI/2;
  // trofeo
  const tro=new T.Group();const gold=new T.MeshStandardMaterial({color:'#e2b33c',metalness:.95,roughness:.22,emissive:'#3a2a00',emissiveIntensity:.35});
  gold.flatShading=true;tro.add(trophyMesh(gold));
  sc.add(tro);
  const conf=confetti(sc,['#f2b705','#ffffff','#ffd86b',kit.shirt,kit.sleeve],0,0);
  const walk=path([{t:4.9,x:-4.6,z:3.0},{t:6.2,x:-4.6,z:2.35},{t:7.3,x:-4.6,z:1.0,y:.8},{t:9.2,x:-.55,z:-.8,y:.8}]);
  let heading=Math.PI,tp=V(0,0,0),tp2=V(0,0,0);const look=V(0,1.5,-1),camPos=V(0,4.6,12.5);
  function update(t,dt){
    rest(me);rest(host);
    // jugador
    const w=walk(t);me.root.position.set(w.x,w.y||0,w.z);
    let target=heading;
    if(t<4.9){target=Math.PI;idle(me,t);if(t>4.3){const u=seg(t,4.3,4.9);const up=Math.sin(u*Math.PI);armA(me,0,up*2.7,.2,.25);armA(me,1,up*2.7,.2,.25);me.hips.position.y=BASE+up*.12}}
    else if(w.mv&&t<9.2){target=w.h;cycle(me,w.d*3.1,.55)}
    else if(t<11.1){target=Math.PI/2;idle(me,t)}
    else{target=0;idle(me,t)}
    heading=angLerp(heading,target,cl(dt*7,0,1));me.root.rotation.y=heading;

    if(t<10.6){armA(host,0,1.25,.45,-.18);armA(host,1,1.25,.45,-.18)}

    host.root.position.x=hx;host.root.rotation.y=t>10.8&&t<11.8?-Math.PI/2+Math.PI*.5*ez(seg(t,10.8,11.8))*0:-Math.PI/2;
    if(t>11.8)host.root.rotation.y=angLerp(-Math.PI/2,-.6,ez(seg(t,11.8,12.4)));

      if(t>13){const b=Math.sin((t-13)*3.2)*.06;me.hips.position.y=BASE+Math.max(0,b)}}
    sc.updateMatrixWorld();
    handsMid(host,tp);handsMid(me,tp2);
    const hu=ez(seg(t,10.2,10.9));tro.position.copy(tp).lerp(tp2,hu);tro.position.y+=lerp(-.14,t>=12.1?-.1:-.14,hu);
    tro.rotation.y=t*.6;
    // luces
    follow.intensity=t>4.6&&t<9.6?3.4:0;follow.position.set(w.x,10,w.z+6);follow.target.position.set(w.x,(w.y||0)+1,w.z);
    key.intensity=t<4.4?1.1:3.2;
    conf.step(dt,t>12.2);
    // cámara
    let cp,lk;
    if(t<3){cp=V(0,4.6,12.5);lk=V(0,1.6,-1.5)}
    else if(t<4.6){const u=ez(seg(t,3,4.6));cp=V(lerp(0,-2.2,u),lerp(4.6,3.2,u),lerp(12.5,9.5,u));lk=V(lerp(0,-4.6,u),lerp(1.6,1.2,u),lerp(-1.5,3,u))}
    else if(t<9.6){cp=V(w.x+2.6,(w.y||0)+2.3,w.z+4.6);lk=V(w.x,(w.y||0)+1.2,w.z)}
    else if(t<12.1){cp=V(0,2.4,3.6);lk=V(0,1.75,-.8)}
    else{const a=lerp(.55,-.45,ez(seg(t,12.1,17)));cp=V(-.55+Math.sin(a)*3.4,1.9+.5*seg(t,12.1,17),-.8+Math.cos(a)*3.4);lk=V(-.55,2.1,-.8)}
    const k=cl(dt*3.2,0,1);camPos.lerp(cp,k);look.lerp(lk,k);cam.position.copy(camPos);cam.lookAt(look);
    // textos
    if(t<3)cap('Gala del '+L.title+' '+L.year);else if(t<4.6)cap('Y el ganador es…');else if(t<9.6)cap(L.name,true);else if(t<12.1)cap('');else cap('¡'+L.title+' '+L.year+'!',true);
  }
  return{scene:sc,cam,update,dur:17,tag:'Gala · Balón de Oro'};
}

/* =========================================================

  stand(0,22,60,0);
  crowd(sc,{n:1400,rows:9,cols:110,colors:['#d7263d','#f2b705','#2e86de','#ffffff','#1b1b1f'],place:(r,c)=>({x:-29+c*.53,y:r*.5+.5,z:22.2+r*1})});
  [[-26,24],[26,24],[-26,-14],[26,-14]].forEach(([x,z])=>{const p=cyl(.25,.3,18,M('#333a48'),8);p.position.set(x,9,z);sc.add(p);const l=box(3,1.4,.4,new T.MeshBasicMaterial({color:'#fffbe8'}));l.position.set(x,18.2,z);l.lookAt(0,0,6);sc.add(l)});
  // jugadores
  const kit=L.kit;
  const me=person({shirt:kit.shirt,sleeve:kit.sleeve,shorts:kit.shorts,socks:kit.socks,num:L.num,name:L.name,numColor:kit.num});
  const gk=person({shirt:'#20c060',sleeve:'#20c060',shorts:'#111',socks:'#20c060',gloves:'#f4f4f4',longSleeve:true,hair:'#3a2616',skin:'#e0b48c',num:1,name:'',numColor:'#0b3d1e'});
  sc.add(me.root,gk.root);gk.root.rotation.y=Math.PI;
  const ball=ballMesh();sc.add(ball);
  const tk=2.52;
  const O={
    gol:{tgt:V(2.75,1.05,11),net:V(3.05,.95,12.1),dive:-1,dx:2.0,fd:.5,ok:true,txt:'¡GOOOL!'},
    atajada:{tgt:V(-2.9,.95,10.62),dive:-1,dx:1.3,ang:1.1,fd:.52,save:V(-4.8,.35,8.2),ok:false,txt:'¡ATAJADA!'},
    palo:{tgt:V(3.6,1.35,11),dive:-1,dx:2.0,fd:.5,post:V(5.2,.2,7.2),ok:false,txt:'¡AL PALO!'},
    picada:{tgt:V(0,1.45,11),net:V(0,.9,12.0),dive:1,dx:2.2,fd:1.05,lob:1.6,ok:true,txt:'¡GOL DE PICADITA!'},
    picada_falla:{tgt:V(0,1.2,10.55),dive:0,fd:1.05,lob:1.5,ok:false,catch:true,txt:'¡TE LA ADIVINÓ!'}
  }[variant];
  const run=path([{t:1.1,x:-1.55,z:-2.85},{t:2.25,x:-.3,z:-.32}]);
  const start=V(0,.11,0);let heading=Math.atan2(1.55,2.85);const camPos=V(-2.4,2.1,-6.6),look=V(0,1.1,9);
  const after=O.ok?path([{t:tk+O.fd+.4,x:-.3,z:-.1},{t:tk+O.fd+3.2,x:-7.5,z:4.5}]):null;
  const ballAt=(t,out)=>{
    if(t<tk)return out.copy(start);
    const u=seg(t,tk,tk+O.fd);
    if(u<1){out.copy(start).lerp(O.tgt,O.lob?u:1-Math.pow(1-u,1.4));out.y=lerp(start.y,O.tgt.y,u)+(O.lob||.25)*4*u*(1-u);return out}
    const t2=t-(tk+O.fd);
    if(O.net){const v=ez(cl(t2/.28,0,1));out.copy(O.tgt).lerp(O.net,v);out.y=Math.max(.11,lerp(O.tgt.y,O.net.y,v)-Math.max(0,t2-.28)*1.6);return out}
    if(O.save||O.post){const d=O.save||O.post;const v=cl(t2/.7,0,1);out.copy(O.tgt).lerp(d,1-Math.pow(1-v,2));out.y=Math.max(.11,lerp(O.tgt.y,.11,Math.min(1,v*2.2)))+Math.abs(Math.sin(v*Math.PI*1.5))*.45*(1-v);return out}
    if(O.catch){gk.spine.updateMatrixWorld();gk.hand[0].getWorldPosition(_a);gk.hand[1].getWorldPosition(_b);return out.copy(_a).add(_b).multiplyScalar(.5).add(V(0,0,-.08))}
    return out.copy(O.tgt)};
  const bp=V(0,0,0);
  function update(t,dt){
    rest(me);rest(gk);
    // pateador
    const w=run(t);let target=heading;
    if(t<1.1){me.root.position.set(-1.55,0,-2.85);idle(me,t);armA(me,0,0,.2,.15);armA(me,1,0,.2,.15)}
    else if(t<2.25){me.root.position.set(w.x,0,w.z);target=w.h;cycle(me,w.d*3.3,.75)}
    else if(t<2.25+.55){me.root.position.set(-.3,0,-.32);target=.12;kickPose(me,seg(t,2.25,2.8))}

        if(t>tk+O.fd+3.2){target=Math.PI*.8;const j=Math.abs(Math.sin((t)*4));armA(me,0,2.8,.2,.2);armA(me,1,2.8,.2,.2);me.hips.position.y=BASE+j*.18}}
      else{me.root.position.set(-.3,0,-.32);if(tr<.25)kickPose(me,1);else{idle(me,t);armA(me,0,2.6,2.3,.35);armA(me,1,2.6,2.3,.35);me.spine.rotation.x=-.15;me.head.rotation.x=-.25}}
    }
    heading=angLerp(heading,target,cl(dt*8,0,1));me.root.rotation.y=heading;
    // portero
    const ds=tk-.06,du=seg(t,ds,ds+.5);
    gk.root.position.set(0,0,10.6);gk.root.rotation.z=0;
    if(t<ds){const b=Math.sin(t*5);gk.root.position.x=.12*Math.sin(t*1.7);legA(gk,0,.15,.45);legA(gk,1,.15,.45);gk.hips.position.y=BASE-.1+.02*b;armA(gk,0,.5,.6,.55);armA(gk,1,.5,.6,.55);gk.spine.rotation.x=.18}
    else if(O.dive){const d=O.dive,e=ez(du);gk.root.position.x=-d*0+d*O.dx*e*(-1)*-1;gk.root.position.x=d*O.dx*e;gk.root.position.y=Math.sin(du*Math.PI)*.45+lerp(0,.12,du);
      gk.root.rotation.z=d*lerp(0,O.ang||1.42,e);armA(gk,0,2.9,.08,.15);armA(gk,1,2.9,.08,.15);legA(gk,0,.2,.3);legA(gk,1,-.1,.2);
      if(t>tk+O.fd+1.4&&!O.ok&&O.save){const g=ez(seg(t,tk+O.fd+1.4,tk+O.fd+2.2));gk.root.rotation.z*=1-g;gk.root.position.y*=1-g;if(g>=1){armA(gk,0,2.8,.3,.4);armA(gk,1,2.8,.3,.4);gk.hips.position.y=BASE+Math.abs(Math.sin(t*5))*.15}}}
    else{ // se queda y la agarra
      const e=ez(seg(t,ds,ds+.6));gk.hips.position.y=BASE-.08;armA(gk,0,lerp(.5,1.35,e),lerp(.6,1.2,e),-.1);armA(gk,1,lerp(.5,1.35,e),lerp(.6,1.2,e),-.1);
      if(t>tk+O.fd+.6){armA(gk,0,1.1,1.5,-.2);armA(gk,1,1.1,1.5,-.2);const j=Math.abs(Math.sin(t*4));gk.hips.position.y=BASE+j*.06}}
    // balón
    sc.updateMatrixWorld();ballAt(t,bp);ball.position.copy(bp);if(t>tk&&!O.catch)ball.rotation.x+=dt*(O.lob?6:20);
    // cámara
    let cp,lk;
    if(t<tk){cp=V(-2.6,2.0,-6.8);lk=V(0,1.1,9)}
    else if(t<tk+O.fd+.5){cp=V(-4.5,2.6,3.2);lk=V(bp.x*.6,1.2,10.4)}
    else if(O.ok){const a=after(t);cp=V(a.x+3.2,2.2,a.z+4.5);lk=V(a.x,1.2,a.z)}
    else{cp=V(1.6,1.9,2.6);lk=V(-.3,1.3,-.3)}
    const k=cl(dt*(t<tk+O.fd+.5&&t>tk?5:3),0,1);camPos.lerp(cp,k);look.lerp(lk,k);cam.position.copy(camPos);cam.lookAt(look);
    if(t<1.1)cap(L.penTitle||'Penal decisivo');else if(t<tk+O.fd+.15)cap('');else cap(L.penTxt||O.txt,O.ok);
  }
  return{scene:sc,cam,update,dur:9,tag:'Penal'};
}
